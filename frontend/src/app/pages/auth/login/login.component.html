<div class="login-screen-stage">
  <!-- Ondas de Seda 3D Naranjas en las 4 esquinas -->
  <div class="login-silk-waves" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="none" class="login-waves-svg">
      <defs>
        <linearGradient id="lgWaveTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff8c24" stop-opacity="0.72" />
          <stop offset="45%" stop-color="#d94800" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#080707" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="lgWaveTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ff9933" stop-opacity="0.78" />
          <stop offset="50%" stop-color="#e04f00" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#080707" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="lgWaveBottom" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ff7b1a" stop-opacity="0.75" />
          <stop offset="55%" stop-color="#b83700" stop-opacity="0.28" />
          <stop offset="100%" stop-color="#080707" stop-opacity="0" />
        </linearGradient>
      </defs>
      <!-- Cintas superiores izquierda y centro -->
      <path d="M-40,-20 C120,40 160,180 -20,290 L-40,-20 Z" fill="url(#lgWaveTopLeft)" />
      <path d="M220,-20 C190,65 80,140 -30,190 L-30,90 C50,55 110,10 140,-20 Z" fill="url(#lgWaveTopLeft)" />
      <path d="M740,-20 C790,45 690,110 560,145 C670,75 690,20 700,-20 Z" fill="url(#lgWaveTopRight)" opacity="0.65" />

      <!-- Cintas derechas envolviendo la tarjeta -->
      <path d="M1140,-30 C1260,60 1320,160 1480,210 L1480,-30 Z" fill="url(#lgWaveTopRight)" />
      <path d="M1480,220 C1340,260 1280,380 1160,440 C1290,430 1390,370 1480,340 Z" fill="url(#lgWaveTopRight)" />

      <!-- Cintas inferiores izquierda y derecha -->
      <path d="M-40,730 C160,740 310,820 490,920 L-40,920 Z" fill="url(#lgWaveBottom)" />
      <path d="M-20,810 C150,790 290,850 420,920 L-20,920 Z" fill="url(#lgWaveTopRight)" opacity="0.55" />
      <path d="M860,920 C1060,860 1240,720 1480,620 L1480,920 Z" fill="url(#lgWaveBottom)" />
    </svg>
  </div>

  <div class="login-split-container">
    <!-- ==================== COLUMNA IZQUIERDA: ARTE 3D + MARCA ==================== -->
    <section class="login-brand-hero">
      <div class="orbit-art-wrap" aria-hidden="true">
        <svg viewBox="0 0 460 310" class="orbit-artwork-svg">
          <defs>
            <radialGradient id="centerGlow" cx="50%" cy="52%" r="48%">
              <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.42" />
              <stop offset="60%" stop-color="#d94600" stop-opacity="0.14" />
              <stop offset="100%" stop-color="#080707" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="bigFolderBack" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffcc5c" />
              <stop offset="100%" stop-color="#ff7714" />
            </linearGradient>
            <linearGradient id="bigFolderFront" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffa336" />
              <stop offset="100%" stop-color="#e04d00" />
            </linearGradient>
            <linearGradient id="orbitStroke" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffb84d" />
              <stop offset="50%" stop-color="#ff6b00" />
              <stop offset="100%" stop-color="#ffd27d" />
            </linearGradient>
          </defs>

          <!-- Resplandor central -->
          <circle cx="235" cy="160" r="140" fill="url(#centerGlow)" />

          <!-- Anillos orbitales luminosos -->
          <g transform="rotate(-8 235 165)">
            <ellipse cx="235" cy="165" rx="182" ry="74" fill="none" stroke="#ff6b00" stroke-width="5" opacity="0.28" />
            <ellipse cx="235" cy="165" rx="182" ry="74" fill="none" stroke="url(#orbitStroke)" stroke-width="2.4" />
            <ellipse cx="235" cy="172" rx="164" ry="64" fill="none" stroke="#ff942e" stroke-width="1.2" opacity="0.55" />
            <!-- Destellos sobre el anillo -->
            <circle cx="54" cy="158" r="4" fill="#fff7ed" />
            <circle cx="416" cy="162" r="4.5" fill="#fff7ed" />
            <circle cx="205" cy="238" r="3.5" fill="#ffd27d" />
          </g>

          <!-- Carpeta 3D Central -->
          <g transform="translate(152, 82) rotate(4 80 70)">
            <path d="M12 18C12 10.27 18.27 4 26 4H64L78 20H134C141.73 20 148 26.27 148 34V112C148 119.73 141.73 126 134 126H26C18.27 126 12 119.73 12 112V18Z" fill="url(#bigFolderBack)" />
            <path d="M6 38C6 30.27 12.27 24 20 24H142C149.73 24 156 30.27 156 38V114C156 121.73 149.73 128 142 128H20C12.27 128 6 121.73 6 114V38Z" fill="url(#bigFolderFront)" />
            <rect x="22" y="17" width="32" height="6.5" rx="3.2" fill="#fff7ed" opacity="0.95" />
          </g>

          <!-- 1. Insignia 3D PDF Roja (Arriba Izquierda) -->
          <g transform="translate(66, 46) rotate(-8 28 32)">
            <rect x="2" y="2" width="52" height="60" rx="11" fill="#e11d48" />
            <path d="M36 2L54 20H41C38.2 20 36 17.8 36 15V2Z" fill="#fda4af" />
            <path d="M28 15C26 21 22 27 19 30C23 29 31 27 36 28C32 25 29 20 28 15Z" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" />
            <text x="28" y="49" text-anchor="middle" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800">PDF</text>
          </g>

          <!-- 2. Insignia 3D Imagen Esmeralda (Arriba Derecha) -->
          <g transform="translate(310, 38) rotate(8 28 28)">
            <rect x="2" y="2" width="54" height="54" rx="12" fill="#10b981" />
            <rect x="9" y="10" width="40" height="36" rx="6" fill="none" stroke="#ffffff" stroke-width="2.2" />
            <circle cx="20" cy="20" r="3.2" fill="#ffffff" />
            <path d="M12 41L23 27L32 36L38 29L46 41H12Z" fill="#ffffff" />
          </g>

          <!-- 3. Insignia 3D Multimedia Púrpura (Abajo Izquierda) -->
          <g transform="translate(76, 176) rotate(6 26 26)">
            <rect x="2" y="2" width="48" height="48" rx="11" fill="#9333ea" />
            <polygon points="20,15 20,37 37,26" fill="#ffffff" />
          </g>

          <!-- 4. Insignia 3D Documento Azul (Derecha) -->
          <g transform="translate(364, 118) rotate(-7 26 30)">
            <rect x="2" y="2" width="48" height="56" rx="11" fill="#2563eb" />
            <path d="M33 2L50 19H37C34.8 19 33 17.2 33 15V2Z" fill="#93c5fd" />
            <rect x="12" y="24" width="26" height="3.2" rx="1.6" fill="#ffffff" />
            <rect x="12" y="32" width="26" height="3.2" rx="1.6" fill="#ffffff" />
            <rect x="12" y="40" width="17" height="3.2" rx="1.6" fill="#ffffff" />
          </g>
        </svg>
      </div>

      <div class="hero-brand-title">
        <span>File</span><span class="hero-brand-orange">Manager</span>
      </div>

      <div class="hero-pillars-row">
        <span>Organiza</span>
        <span class="pillar-dot" aria-hidden="true"></span>
        <span>Gestiona</span>
        <span class="pillar-dot" aria-hidden="true"></span>
        <span>Accede</span>
      </div>

      <p class="hero-tagline">Todo tu espacio, en un solo lugar.</p>
      <div class="hero-bottom-glow-line" aria-hidden="true"></div>
    </section>

    <!-- ==================== COLUMNA DERECHA: TARJETA DE LOGIN ==================== -->
    <section class="login-glass-card">
      <div class="card-brand-top">
        <svg class="card-folder-svg" viewBox="0 0 44 38" aria-hidden="true">
          <path d="M4 6C4 3.79 5.79 2 8 2H17.5L21.5 6.8H36C38.21 6.8 40 8.59 40 10.8V30C40 32.21 38.21 34 36 34H8C5.79 34 4 32.21 4 30V6Z" fill="#ffb84d" />
          <path d="M2 13C2 10.79 3.79 9 6 9H38C40.21 9 42 10.79 42 13V31C42 33.21 40.21 35 38 35H6C3.79 35 2 33.21 2 31V13Z" fill="#ff7315" />
          <rect x="7" y="6" width="10" height="2" rx="1" fill="#fff7ed" opacity="0.85" />
        </svg>
        <span class="card-brand-word">
          <strong>File</strong><span class="hero-brand-orange">Manager</span>
        </span>
      </div>

      <div class="card-welcome-block">
        <h1>
          <span>Bienvenido</span>
          <svg class="welcome-hand-svg" viewBox="0 0 36 36" aria-hidden="true">
            <path fill="#FFDC5D" d="M28.5 17.5c-.8 0-1.5.7-1.5 1.5v-5.5c0-.8-.7-1.5-1.5-1.5s-1.5.7-1.5 1.5v-6c0-.8-.7-1.5-1.5-1.5S21 6.7 21 7.5v-5c0-.8-.7-1.5-1.5-1.5S18 1.7 18 2.5v11c0 .6-.4 1-1 1s-1-.4-1-1v-4c0-.8-.7-1.5-1.5-1.5S13 8.7 13 9.5v9.8c0 5.4 4.4 9.7 9.8 9.7 4.8 0 8.7-3.9 8.7-8.7V19c0-.8-.7-1.5-1.5-1.5z"/>
            <path fill="none" d="M20.2 5.2c.4-.4 1-.4 1.4 0M7.5 16c-1.2 1.2-1.2 3.1 0 4.2l1.4 1.4M27 7c1.2 1.2 1.2 3.1 0 4.2" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </h1>
        <p>Iniciá sesión para continuar</p>
      </div>

      @if (error()) {
        <div class="login-error-banner" role="alert">
          <span>{{ error() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit('/mobile/dashboard')" class="login-pill-form">
        <!-- Campo Usuario o Email -->
        <div class="pill-input-wrap">
          <svg class="pill-field-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M5 20C5 16.5 8.1 14 12 14C15.9 14 19 16.5 19 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <input
            id="email"
            type="text"
            formControlName="email"
            placeholder="Usuario o email"
            autocomplete="username"
            aria-label="Usuario o email"
          />
        </div>

        <!-- Campo Contraseña -->
        <div class="pill-input-wrap">
          <svg class="pill-field-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M8 11V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <circle cx="12" cy="16" r="1.4" fill="currentColor" />
          </svg>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            aria-label="Contraseña"
          />
          <button
            type="button"
            class="pill-eye-btn"
            (click)="togglePasswordVisibility()"
            aria-label="Mostrar u ocultar contraseña">
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" class="eye-svg" aria-hidden="true">
                <path d="M2 12C4.5 7 8 4.5 12 4.5C16 4.5 19.5 7 22 12C19.5 17 16 19.5 12 19.5C8 19.5 4.5 17 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8" />
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" class="eye-svg" aria-hidden="true">
                <path d="M3 3L21 21M10.6 10.6C9.8 11.4 9.8 12.6 10.6 13.4C11.4 14.2 12.6 14.2 13.4 13.4M6.5 6.6C4.6 8 3.1 9.8 2 12C4.5 17 8 19.5 12 19.5C14.1 19.5 16.1 18.8 17.8 17.6M12 4.5C16 4.5 19.5 7 22 12C21.2 13.6 20.2 15 19 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            }
          </button>
        </div>

        <!-- Fila Recordar sesión + ¿Olvidaste tu contraseña? -->
        <div class="login-options-row">
          <button type="button" class="remember-check-row" (click)="toggleRemember()">
            <span class="remember-box" [class.checked]="rememberSession()" aria-hidden="true">
              @if (rememberSession()) {
                <svg viewBox="0 0 16 16" class="check-tiny-svg">
                  <polyline points="3.5 8.5 6.5 11.5 12.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              }
            </span>
            <span>Recordar sesión</span>
          </button>

          <button type="button" class="forgot-link-btn" (click)="fillDemoCredentials()">
            ¿Olvidaste tu contraseña?
          </button>
        </div>

        <!-- Botón Naranja Brillante Iniciar Sesión -->
        <button
          type="submit"
          class="login-orange-cta"
          [disabled]="loading()">
          <svg class="cta-enter-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 4H18C19.1 4 20 4.9 20 6V18C20 19.1 19.1 20 18 20H14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <path d="M4 12H15M11 8L15 12L11 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>{{ loading() ? 'Iniciando sesión…' : 'Iniciar sesión' }}</span>
        </button>
      </form>

      <div class="login-card-divider" aria-hidden="true"></div>

      <div class="login-card-footer">
        <span>¿No tenés una cuenta?</span>
        <a routerLink="/register" class="register-orange-link">Registrate</a>
      </div>
    </section>
  </div>
</div>
